<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link rel="stylesheet" href="../css/estilo.css">
    <style>
         .form{
            text-align: center;
        }
        label{
            font-weight: bold;
        }
    </style>
</head>
<body>
    <header class="cabecalho">
        
    <div id="logo-produto">

    <a href="../index.html">
        <img src="../imagens/SHOP-TADS.png"
             alt="Logo Shop TADS" width="50" height="45">
    </a>

    </div>
       
    </header>
    <form class="form" method="post" action="contato-sucesso.html">
        <br><br>
        <label>Nome:</label>
        <input type="text" name="nome" required autofocus placeholder="Digite um nome" />
        <br><br>
    
        <label>E-mail:</label>
        <input type="email" name="email" required placeholder="Digite um e-mail"><br><br>

        <label>Telefone:</label>
        <input type="tel" name="Telefone" placeholder="Digite um numero de telefone"/><br><br>
        
        <label>Assunto:</label>
        <select name="cor" required>
            <option value="" disabled selected>selecione um assunto</option>
            <option value="azul">Envio</option>
            <option value="pagamento">Pagamento</option>
            <option value="verde">Reclamação</option>
        </select><br><br>
        <textarea name="mensagem" rows="8" cols="40" > </textarea><br/><br/>
        <input type="submit" value="Enviar"/>
        <input type="reset" name="reset"/>
   </form>

</body>
</html>
